<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verge Defense — CMMC Compliance Progress</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="page-header">
    <img class="brand-logo" src="{{ url_for('static', filename='img/logo-banner.png') }}" alt="Verge Defense">
    <h1>Controls Overview <span class="subtitle">(CMMC L2)</span></h1>
  </header>

  <main class="card">
    <h2 class="section-title">Status by practice</h2>

    <div class="legend">
      <span class="legend-item"><span class="swatch not_started"></span>Not Started</span>
      <span class="legend-item"><span class="swatch in_progress"></span>In Progress</span>
      <span class="legend-item"><span class="swatch complete"></span>Complete</span>
    </div>

    <div class="domains">
      {% for domain in domains %}
      <div class="domain-row">
        <div class="domain-label">
          <div class="domain-code">{{ domain.code }}</div>
          <div class="domain-name">{{ domain.name }}</div>
        </div>
        <div class="pills">
          {% for pid in domain.practices %}
          <button type="button" class="pill {{ state[pid] }}" data-id="{{ pid }}">{{ pid }}</button>
          {% endfor %}
        </div>
      </div>
      {% endfor %}
    </div>
  </main>

  <footer class="progress-footer">
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width: {{ percent }}%;"></div>
    </div>
    <div class="progress-label"><span id="progress-percent">{{ percent }}</span>% objectives complete</div>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
